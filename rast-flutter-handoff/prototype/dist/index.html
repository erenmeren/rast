  <script>
    (()=>{let preference='system';try{const saved=JSON.parse(localStorage.getItem('rast-design-settings')||'null');if(['system','light','dark'].includes(saved?.theme))preference=saved.theme;}catch{}const theme=preference==='system'?(window.matchMedia?.('(prefers-color-scheme: dark)').matches?'dark':'light'):preference;document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.colorScheme=theme;})();
  </script>
